name: Mise à jour Parfums

on:
  workflow_dispatch:

  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm install

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Construire la base Zara + mettre à jour Lattafa
        run: npm run scrape

      - name: Valider les données
        run: npm run validate

      - name: Afficher les statistiques
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "data/products.json",
              "utf8"
            )
          );

          console.log(
            "Dernière mise à jour :",
            data.updatedAt
          );

          console.log(
            "Total :",
            data.stats.total
          );

          console.log(
            "Zara :",
            data.stats.zara
          );

          console.log(
            "Lattafa :",
            data.stats.lattafa
          );

          console.log(
            "Inspirations :",
            data.stats.matched
          );

          console.log(
            "Collaborations officielles :",
            data.stats.officialCollaborations
          );
          NODE

      - name: Sauvegarder les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/products.json

          if [ -d "data/history" ]; then
            git add data/history
          fi

          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Mise à jour automatique des parfums"
            git push
          fi
