<!doctype html><meta charset="utf-8"><title>Éditeur inspirations</title>
<style>body{font:14px system-ui;max-width:1000px;margin:30px auto;padding:0 20px}textarea{width:100%;height:70vh;font:12px ui-monospace,monospace;padding:14px}button{padding:10px 14px;margin-right:8px}</style>
<h1>Éditeur local des inspirations</h1><p>Charge <code>data/inspirations.json</code>, modifie-le puis télécharge le JSON. Cet outil ne publie rien automatiquement.</p>
<input id=f type=file accept=".json"><p><textarea id=t placeholder="JSON…"></textarea></p><button id=fmt>Formater</button><button id=dl>Télécharger inspirations.json</button>
<script>
f.onchange=async()=>{t.value=await f.files[0].text()};fmt.onclick=()=>{try{t.value=JSON.stringify(JSON.parse(t.value),null,2)}catch(e){alert(e.message)}};
dl.onclick=()=>{try{const s=JSON.stringify(JSON.parse(t.value),null,2)+"\n";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"application/json"}));a.download="inspirations.json";a.click()}catch(e){alert(e.message)}};
</script>
